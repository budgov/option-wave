name: Model core tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build the extension and test tools
        run: python -m pip install -e . build cmake
      - name: Configure standalone C++ tests
        run: cmake -S . -B build/cpp -DCMAKE_BUILD_TYPE=Release
      - name: Compile standalone C++ tests
        run: cmake --build build/cpp --config Release --parallel 2
      - name: Run C++ and Python parity tests
        run: ctest --test-dir build/cpp -C Release --output-on-failure
      - name: Run the offline example
        run: python -m examples.run_sample
      - name: Verify that the source archive can build a wheel
        shell: bash
        run: |
          python -m build --sdist
          python -m pip wheel --no-deps dist/ocean_wave-1.1.0.tar.gz --wheel-dir dist/from-sdist

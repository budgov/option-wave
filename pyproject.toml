[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.11", "numpy>=1.26"]
build-backend = "setuptools.build_meta"

[project]
name = "option-wave"
version = "0.9.0"
description = "C++ accelerated symmetric ELO and continuous option-wave research model"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "matplotlib>=3.8",
]

[tool.setuptools]
packages = ["option_wave"]

[tool.setuptools.package-data]
option_wave = ["*.py"]

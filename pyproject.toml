[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.11", "numpy>=1.26"]
build-backend = "setuptools.build_meta"

[project]
name = "ocean-wave"
version = "1.1.0"
description = "C++ accelerated multi-factor option-surface and continuous-wave forecasting model"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
]

[tool.setuptools]
packages = ["option_wave"]

[tool.setuptools.package-data]
option_wave = ["*.py"]

[project.urls]
Repository = "https://github.com/budgov/option-wave"
Issues = "https://github.com/budgov/option-wave/issues"
